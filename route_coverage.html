<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrast Security - Route Coverage Analysis</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.2em;
            opacity: 0.95;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #667eea;
            text-decoration: none;
            font-size: 1.1em;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: #764ba2;
            transform: translateX(-5px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            border: 2px solid rgba(102, 126, 234, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
            border-color: #667eea;
        }

        .stat-number {
            font-size: 3.5em;
            font-weight: bold;
            margin: 10px 0;
        }

        .stat-label {
            font-size: 1.1em;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .section-title {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(102, 126, 234, 0.3);
        }

        .charts-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 30px;
            border: 2px solid rgba(102, 126, 234, 0.3);
        }

        .chart-container h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .chart-wrapper {
            position: relative;
            height: 300px;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .app-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            border: 2px solid rgba(102, 126, 234, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .app-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
        }

        .app-card.excellent::before {
            background: linear-gradient(180deg, #00ff88 0%, #00cc66 100%);
        }

        .app-card.good::before {
            background: linear-gradient(180deg, #88ff00 0%, #66cc00 100%);
        }

        .app-card.medium::before {
            background: linear-gradient(180deg, #ffaa00 0%, #dd9900 100%);
        }

        .app-card.poor::before {
            background: linear-gradient(180deg, #ff4444 0%, #dd3333 100%);
        }

        .app-card.critical::before {
            background: linear-gradient(180deg, #ff0000 0%, #cc0000 100%);
        }

        .app-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
            border-color: #667eea;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            gap: 15px;
        }

        .app-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #fff;
            flex: 1;
            word-break: break-word;
        }

        .coverage-badge {
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.2em;
            white-space: nowrap;
        }

        .coverage-badge.excellent {
            background: linear-gradient(135deg, #00ff88 0%, #00cc66 100%);
            color: #000;
        }

        .coverage-badge.good {
            background: linear-gradient(135deg, #88ff00 0%, #66cc00 100%);
            color: #000;
        }

        .coverage-badge.medium {
            background: linear-gradient(135deg, #ffaa00 0%, #dd9900 100%);
            color: #000;
        }

        .coverage-badge.poor {
            background: linear-gradient(135deg, #ff4444 0%, #dd3333 100%);
            color: #fff;
        }

        .coverage-badge.critical {
            background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
            color: #fff;
        }

        .app-metrics {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .metric-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(102, 126, 234, 0.2);
        }

        .metric-label {
            font-size: 0.85em;
            opacity: 0.7;
            margin-bottom: 5px;
        }

        .metric-value {
            font-size: 1.4em;
            font-weight: bold;
            color: #667eea;
        }

        .progress-bar-container {
            margin-top: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            height: 25px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            display: flex;
            transition: width 0.5s ease;
        }

        .progress-exercised {
            background: linear-gradient(90deg, #00ff88 0%, #00cc66 100%);
        }

        .progress-discovered {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        }

        .progress-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.85em;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            z-index: 1;
        }

        .vuln-alert {
            background: rgba(255, 0, 0, 0.15);
            border: 2px solid #ff0000;
            border-radius: 8px;
            padding: 12px;
            margin-top: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .vuln-alert.critical {
            background: rgba(255, 0, 0, 0.2);
            border-color: #ff0000;
        }

        .vuln-alert.warning {
            background: rgba(255, 170, 0, 0.15);
            border-color: #ffaa00;
        }

        .vuln-icon {
            font-size: 1.5em;
        }

        .vuln-text {
            flex: 1;
            font-size: 0.9em;
        }

        .route-list {
            margin-top: 15px;
        }

        .route-list-header {
            font-size: 0.9em;
            color: #667eea;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .route-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 12px;
            margin-bottom: 5px;
            border-radius: 5px;
            font-size: 0.85em;
            border-left: 3px solid #667eea;
        }

        .route-item.has-vuln {
            border-left-color: #ff0000;
            background: rgba(255, 0, 0, 0.1);
        }

        footer {
            text-align: center;
            padding: 20px;
            color: rgba(255, 255, 255, 0.6);
            border-top: 1px solid rgba(102, 126, 234, 0.3);
            margin-top: 40px;
        }

        @media (max-width: 768px) {
            .charts-section {
                grid-template-columns: 1fr;
            }

            .app-grid {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 2em;
            }

            .app-metrics {
                grid-template-columns: 1fr;
            }
        }
        .source-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; font-size: 0.95em; color: rgba(255,255,255,0.8); }
        .source-badge { padding: 3px 12px; border-radius: 12px; font-weight: bold; font-size: 0.85em; }
        .source-badge.live { background: #00c878; color: #0a0e27; }
        .source-badge.mock { background: #ffaa00; color: #0a0e27; }
        .refresh-btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; border: 0; border-radius: 8px; padding: 8px 18px; cursor: pointer; font-size: 0.95em; }
        .error-banner { display: none; background: rgba(255, 68, 68, 0.15); border: 2px solid #ff4444; border-radius: 10px; padding: 16px 20px; margin-bottom: 20px; }
        .route-verb { display: inline-block; min-width: 54px; font-weight: bold; color: #8fa2ff; font-family: 'SF Mono', Menlo, Consolas, monospace; }
        .route-item.unexercised { opacity: 0.65; border-left-color: #8892b0; }
        .progress-label { white-space: nowrap; }
        .route-list { max-height: 420px; overflow-y: auto; }
        .route-toggle { background: none; border: 1px solid rgba(102,126,234,0.5); color: #8fa2ff; border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 0.85em; margin-top: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Back to Reports</a>

        <header>
            <h1>Route Coverage Analysis</h1>
            <p>Live testing coverage across Cargo Cats microservices</p>
        </header>

        <div class="source-bar">
            <div><span id="sourceBadge" class="source-badge mock">Loading</span> <span id="updated"></span></div>
            <button class="refresh-btn" id="refreshBtn">↻ Refresh</button>
        </div>
        <div class="error-banner" id="errorBanner"></div>

        <div class="stats-grid" id="stats"></div>

        <div class="charts-section">
            <div class="chart-container">
                <h2>Coverage Distribution</h2>
                <div class="chart-wrapper"><canvas id="coverageChart"></canvas></div>
            </div>
            <div class="chart-container">
                <h2>Routes by Application</h2>
                <div class="chart-wrapper"><canvas id="routesChart"></canvas></div>
            </div>
        </div>

        <section>
            <h2 class="section-title">Application Route Coverage</h2>
            <div class="app-grid" id="appGrid"></div>
        </section>

        <footer>
            <p>Generated using Contrast Security MCP Server | <a href="https://www.contrastsecurity.com" target="_blank" style="color: #667eea;">contrastsecurity.com</a></p>
            <p style="margin-top: 10px; font-size: 0.9em;">Static snapshot: <a href="route_coverage_static.html" style="color: #667eea;">route_coverage_static.html</a></p>
        </footer>
    </div>

    <script src="assets/reports.js"></script>
    <script>
        // Shared behaviour lives in assets/reports.js so a fix lands once, not eight times.
        const { esc, shortApp, HOSTED, hostedNotice, failureBanner } = Reports;
        const charts = {};
        Chart.defaults.color = '#fff';
        Chart.defaults.borderColor = 'rgba(102, 126, 234, 0.3)';
        function tier(pct) {
            if (pct >= 90) return 'excellent';
            if (pct >= 70) return 'good';
            if (pct >= 50) return 'medium';
            if (pct >= 25) return 'poor';
            return 'critical';
        }

        function renderStats(t) {
            document.getElementById('stats').innerHTML = [
                ['Total Routes', t.totalRoutes],
                ['Exercised Routes', t.exercised],
                ['Discovered Routes', t.discovered],
                ['Average Coverage', t.coveragePercent + '%'],
            ].map(([label, value]) => `<div class="stat-card"><div class="stat-label">${label}</div><div class="stat-number">${value}</div></div>`).join('');
        }

        function appCard(a) {
            const cls = tier(a.coveragePercent);
            const icon = a.criticalVulnerabilities ? '🚨' : '⚠️';
            const crit = a.criticalVulnerabilities ? `, ${a.criticalVulnerabilities} critical` : '';
            const vulnAlert = a.vulnerabilities
                ? `<div class="vuln-alert ${a.criticalVulnerabilities ? 'critical' : 'warning'}"><span class="vuln-icon">${icon}</span><span class="vuln-text">${a.vulnerabilities} vulnerabilit${a.vulnerabilities === 1 ? 'y' : 'ies'} on routes${crit}</span></div>`
                : '';
            const routes = (a.routes || []).map((r) => {
                const flag = r.vulnerabilities ? ` <strong style="color:#ff6666;">${r.vulnerabilities} vuln</strong>` : '';
                return `<div class="route-item ${r.vulnerabilities ? 'has-vuln' : ''} ${r.status === 'DISCOVERED' ? 'unexercised' : ''}"><span class="route-verb">${esc(r.verb || '—')}</span> ${esc(r.url)}${flag}</div>`;
            }).join('');
            const shown = (a.routes || []).length;
            const heading = shown === a.totalRoutes ? `All ${shown} routes` : `${shown} of ${a.totalRoutes} routes`;
            const routeBlock = routes
                ? `<button class="route-toggle" data-app="${esc(a.appId)}">Show routes</button><div class="route-list" id="routes-${esc(a.appId)}" style="display:none;"><div class="route-list-header">${heading}</div>${routes}</div>`
                : '';
            return `<div class="app-card ${cls}">
                <div class="app-header">
                    <div class="app-name">${esc(shortApp(a.name))}</div>
                    <div class="coverage-badge ${cls}">${a.coveragePercent}%</div>
                </div>
                <div class="app-metrics">
                    <div class="metric-item"><div class="metric-label">Total Routes</div><div class="metric-value">${a.totalRoutes}</div></div>
                    <div class="metric-item"><div class="metric-label">Exercised</div><div class="metric-value">${a.exercised}</div></div>
                    <div class="metric-item"><div class="metric-label">Discovered</div><div class="metric-value">${a.discovered}</div></div>
                    <div class="metric-item"><div class="metric-label">Language</div><div class="metric-value" style="font-size: 1em; opacity: 0.7;">${esc(a.language || '—')}</div></div>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar">
                        <div class="progress-exercised" style="width: ${a.coveragePercent}%;"></div>
                        <div class="progress-discovered" style="width: ${(100 - a.coveragePercent).toFixed(2)}%;"></div>
                    </div>
                    <div class="progress-label">${a.exercised} exercised / ${a.discovered} discovered</div>
                </div>
                ${vulnAlert}
                ${routeBlock}
            </div>`;
        }

        function renderApps(apps) {
            const grid = document.getElementById('appGrid');
            grid.innerHTML = apps.slice().sort((a, b) => b.totalRoutes - a.totalRoutes).map(appCard).join('');
            grid.querySelectorAll('.route-toggle').forEach((btn) => {
                btn.addEventListener('click', () => {
                    const list = document.getElementById('routes-' + btn.dataset.app);
                    const open = list.style.display !== 'none';
                    list.style.display = open ? 'none' : 'block';
                    btn.textContent = open ? 'Show routes' : 'Hide routes';
                });
            });
        }

        function upsertChart(id, config) {
            if (charts[id]) charts[id].destroy();
            charts[id] = new Chart(document.getElementById(id).getContext('2d'), config);
        }

        function renderCharts(d) {
            upsertChart('coverageChart', {
                type: 'doughnut',
                data: {
                    labels: ['Exercised', 'Discovered only'],
                    datasets: [{ data: [d.totals.exercised, d.totals.discovered], backgroundColor: ['#00c878', '#667eea'], borderWidth: 2, borderColor: '#0a0e27' }],
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { padding: 20, font: { size: 14 } } },
                        tooltip: { callbacks: { label: (c) => { const t = c.dataset.data.reduce((a, b) => a + b, 0); return `${c.label}: ${c.parsed} (${t ? ((c.parsed / t) * 100).toFixed(1) : 0}%)`; } } },
                    },
                },
            });
            const apps = d.apps.slice().sort((a, b) => b.totalRoutes - a.totalRoutes);
            upsertChart('routesChart', {
                type: 'bar',
                data: {
                    labels: apps.map((a) => shortApp(a.name)),
                    datasets: [
                        { label: 'Exercised', data: apps.map((a) => a.exercised), backgroundColor: '#00c878' },
                        { label: 'Discovered only', data: apps.map((a) => a.discovered), backgroundColor: '#667eea' },
                    ],
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        x: { stacked: true, grid: { display: false }, ticks: { font: { size: 11 } } },
                        y: { stacked: true, beginAtZero: true, grid: { color: 'rgba(102, 126, 234, 0.2)' } },
                    },
                    plugins: { legend: { position: 'bottom', labels: { padding: 15, font: { size: 13 } } }, tooltip: { mode: 'index', intersect: false } },
                },
            });
        }

        async function load() {
            const banner = document.getElementById('errorBanner');
            banner.style.display = 'none';
            if (HOSTED) { hostedNotice(); return; }
            try {
                const res = await fetch('/api/routes', { cache: 'no-store' });
                const ct = res.headers.get('content-type') || '';
                if (!ct.includes('json')) throw new Error('NOT_REPORT_SERVER');
                const d = await res.json();
                if (!res.ok) throw new Error(d.error || res.statusText);
                Reports.markLoaded(d);
                renderStats(d.totals); renderCharts(d); renderApps(d.apps);
            } catch (err) {
                const b = document.getElementById('sourceBadge');
                b.textContent = 'NO DATA';
                b.className = 'source-badge mock';
                failureBanner(err);
            }
        }

        document.getElementById('refreshBtn').addEventListener('click', load);
        load();
    </script>
</body>
</html>
