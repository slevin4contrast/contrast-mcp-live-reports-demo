    <script src="assets/reports.js"></script>
    <script>
        // Shared behaviour lives in assets/reports.js so a fix lands once, not eight times.
        const { esc, shortApp, HOSTED, hostedNotice, failureBanner } = Reports;
        const SEV_CLASS = { Critical: 'severity-critical', High: 'severity-high', Medium: 'severity-medium', Low: 'severity-low', Note: 'severity-note' };


        // Contrast returns this guidance as light markdown, including fenced code
        // blocks. Split on the fences so code keeps its formatting and prose does not.
        function mdLite(text) {
            return String(text == null ? '' : text).split(/```/).map((part, i) => {
                if (i % 2 === 1) {
                    const lang = (part.match(/^([a-zA-Z0-9]+)\n/) || [])[1] || '';
                    const body = part.replace(/^[a-zA-Z0-9]*\n/, '');
                    return '<div class="code-block" style="margin:12px 0;"><pre style="white-space:pre-wrap;margin:0;">'
                        + (lang ? '<span style="opacity:.55;font-size:.85em;">' + esc(lang) + '</span>\n' : '')
                        + esc(body.replace(/\s+$/, '')) + '</pre></div>';
                }
                return esc(part)
                    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener" style="color:#8fa2ff;">$1</a>')
                    .replace(/`([^`]+)`/g, '<code>$1</code>')
                    .split(/\n{2,}/)
                    .filter((p) => p.trim())
                    .map((p) => '<p style="margin-bottom:12px;">' + p.replace(/\n/g, ' ') + '</p>')
                    .join('');
            }).join('');
        }

        function renderPicker(list, chosen) {
            document.getElementById('vulnSelect').innerHTML = list.map((v) =>
                `<option value="${esc(v.id)}" data-app="${esc(v.appId)}"${v.id === chosen ? ' selected' : ''}>` +
                `${esc(v.severity)} — ${esc(v.title).slice(0, 80)} (${esc(shortApp(v.app))})</option>`).join('');
        }

        function renderDetail(d) {
            if (!d) {
                document.getElementById('detail').innerHTML = Reports.emptyState(
                    'findings to remediate', 'Contrast Assess',
                    ['Remediation guidance comes attached to a finding, so there must be one first.']);
                return;
            }
            const sev = SEV_CLASS[d.severity] || 'severity-note';

            const card = `<div class="vulnerability-card">
                <div class="vuln-header">
                    <div>
                        <div class="vuln-title">${esc(d.title)}</div>
                        <div class="vuln-id">${esc(d.id)} &middot; ${esc(shortApp(d.app))} &middot; ${esc(d.type)}</div>
                    </div>
                    <span class="severity-badge ${sev}">${esc(d.severity)}</span>
                </div>
            </div>`;

            const fix = d.howToFix
                ? `<div class="sf-section"><h2>How to fix it</h2><p class="sub">Guidance Contrast returns for the ${esc(d.type)} rule</p></div>
                   <div class="fix-explanation">${mdLite(d.howToFix)}</div>`
                : '';

            const hint = d.remediationHint
                ? `<div class="sf-section"><h2>Instructions for an AI assistant</h2>
                     <p class="sub">Contrast ships these rules alongside the finding so a coding agent fixes it safely rather than just silencing the alert</p></div>
                   <div class="best-practice">${mdLite(d.remediationHint)}</div>`
                : '';

            const libNames = d.vulnerableLibraries.map((l) => (l.name || '').replace(/-[0-9][^-]*\.jar$/, ''));
            const traceLines = d.stackTrace.map((f) => {
                const hot = libNames.some((n) => n && f.includes(n.split('-')[0]));
                return `<div${hot ? ' class="lib"' : ''}>${esc(f)}</div>`;
            }).join('');
            const trace = d.stackTrace.length
                ? `<div class="sf-section"><h2>Where it flows</h2><p class="sub">${d.stackTrace.length} frames from entry point to sink, innermost first</p></div>
                   <button class="toggle-btn" id="traceToggle">Show stack trace</button>
                   <div class="trace" id="trace" style="display:none;">${traceLines}</div>`
                : '';

            const libs = d.vulnerableLibraries.length
                ? `<div class="sf-section"><h2>Vulnerable libraries in this call path</h2>
                     <p class="sub">Upgrading one of these may remove the finding without a code change</p></div>
                   <table class="lib-table">
                     <thead><tr><th>Library</th><th>Grade</th><th>Version</th><th>Latest</th><th>Behind</th><th>Classes used</th><th>CVEs</th></tr></thead>
                     <tbody>${d.vulnerableLibraries.map((l) => `<tr>
                        <td><code>${esc(l.name)}</code></td>
                        <td><span class="grade grade-${esc(l.grade || 'A')}">${esc(l.grade || '—')}</span></td>
                        <td>${esc(l.version)}</td>
                        <td>${esc(l.latestVersion || '—')}</td>
                        <td>${l.monthsOutdated ? l.monthsOutdated + ' mo' : 'current'}</td>
                        <td>${l.classesUsed} / ${l.classCount}</td>
                        <td>${l.total}</td></tr>`).join('')}</tbody></table>`
                : '';

            const next = `<div class="warning-box">
                <strong>Before you call it fixed.</strong> Redeploy, then reproduce the request from the
                <a href="poc_generator.html" style="color:#8fa2ff;">PoC generator</a> and hit Refresh here. The finding
                should stop being reported. If you fixed it with validation logic that Contrast does not recognise, it may
                keep reporting until you register a
                <a href="https://docs.contrastsecurity.com/en/security-controls.html" target="_blank" rel="noopener" style="color:#8fa2ff;">Security Control</a>.
            </div>`;

            document.getElementById('detail').innerHTML = card + fix + hint + libs + trace + next;

            const tt = document.getElementById('traceToggle');
            if (tt) tt.addEventListener('click', () => {
                const t = document.getElementById('trace');
                const open = t.style.display !== 'none';
                t.style.display = open ? 'none' : 'block';
                tt.textContent = open ? 'Show stack trace' : 'Hide stack trace';
            });
        }

        async function load(id, appId) {
            const banner = document.getElementById('errorBanner');
            banner.style.display = 'none';
            if (HOSTED) { hostedNotice(); return; }
            Reports.startProgress('Fetching the finding');
            try {
                const q = id ? `?id=${encodeURIComponent(id)}&appId=${encodeURIComponent(appId || '')}` : '';
                const res = await fetch('/api/vulnerability' + q, { cache: 'no-store' });
                const ct = res.headers.get('content-type') || '';
                if (!ct.includes('json')) throw new Error('NOT_REPORT_SERVER');
                const d = await res.json();
                if (!res.ok) throw new Error(d.error || res.statusText);
                Reports.markLoaded(d);
                renderPicker(d.list, d.detail ? d.detail.id : null);
                renderDetail(d.detail);
            } catch (err) {
                const b = document.getElementById('sourceBadge');
                b.textContent = 'NO DATA';
                b.className = 'source-badge mock';
                failureBanner(err);
            }
        }

        document.getElementById('vulnSelect').addEventListener('change', (e) => {
            const opt = e.target.selectedOptions[0];
            load(e.target.value, opt && opt.dataset.app);
        });
        document.getElementById('refreshBtn').addEventListener('click', () => {
            const sel = document.getElementById('vulnSelect');
            const opt = sel.selectedOptions[0];
            load(sel.value || undefined, opt && opt.dataset.app);
        });
        load();
    </script>
