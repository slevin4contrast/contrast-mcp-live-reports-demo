        .container {

            margin: 0 auto;
        }

        header {

            padding: 40px 20px;

            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .vuln-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            border: 2px solid rgba(102, 126, 234, 0.3);
        }

        .vuln-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .vuln-title {
            flex: 1;
            min-width: 300px;
        }

        .vuln-title h2 {
            color: #667eea;
            font-size: 1.8em;
            margin-bottom: 10px;
        }

        .vuln-id {
            font-family: monospace;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9em;
        }

        .severity-badge {
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9em;
        }

        .severity-critical {
            background: #ff4444;
            color: #fff;
        }

        .severity-high {
            background: #ff8800;
            color: #fff;
        }

        .vuln-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .meta-item {
            background: rgba(102, 126, 234, 0.1);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .meta-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .meta-value {
            color: #fff;
            font-weight: 500;
        }

        .section-title {
            color: #667eea;
            font-size: 1.4em;
            margin: 30px 0 15px 0;
            padding-bottom: 10px;

            overflow-x: auto;
            border: 1px solid rgba(102, 126, 234, 0.3);

            color: #667eea;
            margin-bottom: 8px;

            border-radius: 8px;

            overflow-x: auto;

            color: #00ff88;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin: 15px 0;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .alert-warning {
            background: rgba(255, 136, 0, 0.2);
            border-left: 4px solid #ff8800;
        }

        .alert-danger {
            background: rgba(255, 68, 68, 0.2);
            border-left: 4px solid #ff4444;
        }

        .alert-icon {
            font-size: 1.5em;
        }

        .stacktrace {
            max-height: 400px;
            overflow-y: auto;
        }

        .stack-frame {
            padding: 8px 12px;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;

        .stack-frame:hover {
            background: rgba(102, 126, 234, 0.1);

        .vulnerable-frame {
            background: rgba(255, 68, 68, 0.2);
            border-left: 3px solid #ff4444;
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(102, 126, 234, 0.3);
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab.active {
            background: rgba(102, 126, 234, 0.2);
            border-bottom-color: transparent;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {

    <script src="assets/reports.js"></script>
    <script>
        // Shared behaviour lives in assets/reports.js so a fix lands once, not eight times.
        const { esc, shortApp, HOSTED, hostedNotice, failureBanner } = Reports;
        const SEV_CLASS = { Critical: 'severity-critical', High: 'severity-high', Medium: 'severity-medium', Low: 'severity-low', Note: 'severity-note' };

        // Turn the captured raw HTTP request into a runnable curl command.
        function toCurl(raw) {
            if (!raw) return null;
            const norm = raw.replace(/\r\n/g, '\n');
            const split = norm.indexOf('\n\n');
            const headPart = split === -1 ? norm : norm.slice(0, split);
            const body = split === -1 ? '' : norm.slice(split + 2).trim();
            const lines = headPart.split('\n').filter(Boolean);
            if (!lines.length) return null;

            const [method, path] = lines[0].split(/\s+/);
            const headers = lines.slice(1)
                .map((l) => { const i = l.indexOf(':'); return i === -1 ? null : [l.slice(0, i).trim(), l.slice(i + 1).trim()]; })
                .filter(Boolean)
                .filter(([k]) => !['content-length', 'host'].includes(k.toLowerCase()));
            const hostHeader = lines.slice(1).find((l) => /^host:/i.test(l));
            const host = hostHeader ? hostHeader.split(':').slice(1).join(':').trim() : 'TARGET-HOST';

            const parts = [`curl -i -X ${method || 'GET'} 'http://${host}${path || '/'}'`];
            headers.forEach(([k, v]) => parts.push(`  -H '${k}: ${v.replace(/'/g, "'\\''")}'`));
            if (body) parts.push(`  --data '${body.replace(/'/g, "'\\''")}'`);
            return parts.join(' \\\n');
        }

        // A large organization can have thousands of findings, and no one picks
        // one by scrolling a dropdown that long. Narrow it first.
        let PICKER_LIST = [];

        function applyPickerFilter(chosen) {
            const q = (document.getElementById('vulnFilter').value || '').toLowerCase();
            const list = q
                ? PICKER_LIST.filter((v) => (v.title + ' ' + v.app + ' ' + v.type).toLowerCase().includes(q))
                : PICKER_LIST;
            const capped = list.slice(0, 500);
            document.getElementById('vulnCount').textContent = list.length === PICKER_LIST.length
                ? `${PICKER_LIST.length} findings`
                : `${list.length} of ${PICKER_LIST.length} match`;
            document.getElementById('vulnSelect').innerHTML = capped.map((v) =>
                `<option value="${esc(v.id)}" data-app="${esc(v.appId)}"${v.id === chosen ? ' selected' : ''}>` +
                `${esc(v.severity)} — ${esc(v.title).slice(0, 80)} (${esc(shortApp(v.app))})</option>`).join('');
        }

        function renderPicker(list, chosen) {
            PICKER_LIST = list;
            applyPickerFilter(chosen);
        }

        function renderDetail(d) {
            if (!d) {
                document.getElementById('detail').innerHTML = Reports.emptyState(
                    'findings to reproduce', 'Contrast Assess',
                    ['A proof of concept needs a finding with a captured request behind it.']);
                return;
            }
            const curl = toCurl(d.httpRequest);
            const sev = SEV_CLASS[d.severity] || 'severity-note';

            const card = `<div class="vuln-card">
                <div class="vuln-header">
                    <div>
                        <div class="vuln-title">${esc(d.title)}</div>
                        <div class="vuln-id">${esc(d.id)}</div>
                    </div>
                    <span class="severity-badge ${sev}">${esc(d.severity)}</span>
                </div>
                <div class="vuln-meta">
                    <div class="meta-item"><div class="meta-label">Application</div><div class="meta-value">${esc(shortApp(d.app))}</div></div>
                    <div class="meta-item"><div class="meta-label">Rule</div><div class="meta-value">${esc(d.type)}</div></div>
                    <div class="meta-item"><div class="meta-label">Status</div><div class="meta-value">${esc(d.status)}</div></div>
                    <div class="meta-item"><div class="meta-label">Environment</div><div class="meta-value">${esc((d.environments || []).join(', ') || '—')}</div></div>
                    <div class="meta-item"><div class="meta-label">First seen</div><div class="meta-value">${d.firstSeenAt ? new Date(d.firstSeenAt).toLocaleDateString() : '—'}</div></div>
                    <div class="meta-item"><div class="meta-label">Last seen</div><div class="meta-value">${d.lastSeenAt ? new Date(d.lastSeenAt).toLocaleDateString() : '—'}</div></div>
                </div>
            </div>`;

            const redaction = `<div class="alert alert-warning">
                <span class="alert-icon">⚠️</span>
                <div><strong>Values are redacted.</strong> Contrast strips sensitive headers and replaces sensitive
                parameter values before returning the captured request, so placeholders such as
                <code>contrast-redacted-financial-info</code> appear where real data was sent. Substitute your own
                test values before running anything below.</div>
            </div>`;

            const req = d.httpRequest
                ? `<h2 class="section-title">Captured Request</h2>
                   <div class="code-block http-request"><button class="copy-btn" data-copy="req">Copy</button><pre id="req">${esc(d.httpRequest)}</pre></div>`
                : `<h2 class="section-title">Captured Request</h2><div class="alert alert-warning"><span class="alert-icon">ℹ️</span>
                   <div>No HTTP request was captured for this finding. Some rule types, such as configuration and
                   cryptography checks, are found by inspecting the application rather than by observing a request.</div></div>`;

            const curlBlock = curl
                ? `<h2 class="section-title">Reproduction Command</h2>
                   <div class="code-block curl-command"><button class="copy-btn" data-copy="curl">Copy</button><pre id="curl">${esc(curl)}</pre></div>`
                : '';

            const steps = d.httpRequest ? `<h2 class="section-title">Reproduction Steps</h2>
                <div class="poc-steps">
                    <div class="step"><div class="step-number">1</div><div class="step-content">
                        <strong>Confirm you are authorized.</strong> Run this only against an environment you own or have
                        written permission to test. This finding was observed in ${esc((d.environments || []).join(', ') || 'an unknown environment')}.</div></div>
                    <div class="step"><div class="step-number">2</div><div class="step-content">
                        <strong>Replace the redacted values.</strong> Swap each <code>contrast-redacted-*</code> placeholder
                        and any session cookie for your own test values.</div></div>
                    <div class="step"><div class="step-number">3</div><div class="step-content">
                        <strong>Point it at your host.</strong> Change <code>TARGET-HOST</code> to the instance you are testing.</div></div>
                    <div class="step"><div class="step-number">4</div><div class="step-content">
                        <strong>Send the request and watch Contrast.</strong> The agent should raise ${esc(d.type)} again on
                        ${esc(shortApp(d.app))}, which confirms the finding reproduces.</div></div>
                    <div class="step"><div class="step-number">5</div><div class="step-content">
                        <strong>Fix it.</strong> The <a href="smartfix_guide.html" style="color:#8fa2ff;">SmartFix guide</a>
                        shows the remediation Contrast recommends for this same finding.</div></div>
                </div>` : '';

            document.getElementById('detail').innerHTML = card + redaction + req + curlBlock + steps;

            document.querySelectorAll('.copy-btn').forEach((b) => {
                b.addEventListener('click', () => {
                    const el = document.getElementById(b.dataset.copy);
                    navigator.clipboard.writeText(el.textContent).then(() => {
                        const t = b.textContent; b.textContent = 'Copied'; setTimeout(() => { b.textContent = t; }, 1200);
                    }).catch(() => { b.textContent = 'Copy failed'; });
                });
            });
        }

        async function load(id, appId) {
            const banner = document.getElementById('errorBanner');
            banner.style.display = 'none';
            if (HOSTED) { hostedNotice(); return; }
            Reports.startProgress('Fetching the finding');
            try {
                const q = id ? `?id=${encodeURIComponent(id)}&appId=${encodeURIComponent(appId || '')}` : '';
                const res = await fetch('/api/vulnerability' + q, { cache: 'no-store' });
                const ct = res.headers.get('content-type') || '';
                if (!ct.includes('json')) throw new Error('NOT_REPORT_SERVER');
                const d = await res.json();
                if (!res.ok) throw new Error(d.error || res.statusText);
                Reports.markLoaded(d);
                renderPicker(d.list, d.detail ? d.detail.id : null);
                renderDetail(d.detail);
            } catch (err) {
                const b = document.getElementById('sourceBadge');
                b.textContent = 'NO DATA';
                b.className = 'source-badge mock';
                failureBanner(err);
            }
        }

        document.getElementById('vulnSelect').addEventListener('change', (e) => {
            const opt = e.target.selectedOptions[0];
            load(e.target.value, opt && opt.dataset.app);
        });
        document.getElementById('vulnFilter').addEventListener('input', () => applyPickerFilter(null));
        document.getElementById('refreshBtn').addEventListener('click', () => {
            const sel = document.getElementById('vulnSelect');
            const opt = sel.selectedOptions[0];
            load(sel.value || undefined, opt && opt.dataset.app);
        });
        load();
    </script>
</body>
</html>
